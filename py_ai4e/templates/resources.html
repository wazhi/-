{% extends 'base.html' %}{% block content %}<form class='card'>学生：<select name='student_id'>{% for s in students %}<option value='{{s.id}}' {% if s.id==student_id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select>知识点：<select name='knowledge_id'>{% for k in knowledge_points %}<option value='{{k.id}}' {% if k.id==knowledge_id %}selected{% endif %}>{{k.name}}</option>{% endfor %}</select><button>推荐</button></form>{% for r in items %}<div class='card'><b>{{r.title}}</b><p>{{r.type}} 难度{{r.difficulty}} {{r.duration}}</p><p>{{r.description}}</p></div>{% endfor %}{% endblock %}
