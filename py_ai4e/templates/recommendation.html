{% extends 'base.html' %}{% block content %}<form class='card'>学生：<select name='student_id'>{% for s in students %}<option value='{{s.id}}' {% if s.id==student_id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select>目标：<select name='goal'>{% for g in goals %}<option {% if g==goal %}selected{% endif %}>{{g}}</option>{% endfor %}</select><button>生成路径</button></form>{% for i in items %}<div class='card'><b>Day {{i.day}} {{i.knowledgeName}}</b><p>{{i.reason}}</p><p>{{i.task}} | {{i.resourceType}} | {{i.estimatedTime}}</p></div>{% endfor %}{% endblock %}
