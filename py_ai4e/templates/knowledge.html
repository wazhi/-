{% extends 'base.html' %}{% block content %}<form class='card'>知识点：<select name='kid'>{% for k in knowledge_points %}<option value='{{k.id}}' {% if k.id==selected.id %}selected{% endif %}>{{k.name}}</option>{% endfor %}</select><button>查看</button></form><div class='card'><h3>{{selected.name}}</h3><p>分类{{selected.category}} 难度{{selected.difficulty}}</p><p>{{selected.description}}</p><p>前置：{{selected.prerequisites|join('、') if selected.prerequisites else '无'}}</p></div>{% endblock %}
